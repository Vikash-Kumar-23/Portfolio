<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Portfolio/images/logos/vik3.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vikash Portfolio</title>
    <script>
      // SPA fallback for GitHub Pages
      // Redirect any 404 to the index.html which React Router will handle
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      
      // Always redirect to Portfolio base if within that path
      if (pathSegments.length > 0) {
        window.location.href = '/Portfolio/';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <p>Redirecting to portfolio...</p>
  </body>
</html>
